name: Import Ringnest art assets

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/import-ringnest-art.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and install art
        run: |
          set -euo pipefail
          curl -sSL "https://filebin.net/2c465a6b639a9fc5/rn_art_exact.tar.gz" -o /tmp/rn_art_exact.tar.gz
          echo "902c7538fe7d7cf7786ba331443d905dc8abe33d515656520f45e7e3e24b2a7d  /tmp/rn_art_exact.tar.gz" | sha256sum -c -
          mkdir -p /tmp/rn_art_extract scripts/art
          tar xzf /tmp/rn_art_exact.tar.gz -C /tmp/rn_art_extract
          cp /tmp/rn_art_extract/art_0.content.txt scripts/art/brand-icon.jpg.b64
          cp /tmp/rn_art_extract/art_1.content.txt scripts/art/pet-orbits-mark.jpg.b64
          cp /tmp/rn_art_extract/art_2.content.txt scripts/art/pet-orbits-thumb.jpg.b64
          cp /tmp/rn_art_extract/art_3.content.txt scripts/art/pet-orbits-icon.jpg.b64
          cp /tmp/rn_art_extract/art_4.content.txt scripts/art/brand-banner.jpg.b64
          cp /tmp/rn_art_extract/art_5.content.txt scripts/art/brand-mark.jpg.b64
          cp /tmp/rn_art_extract/art_6.content.txt scripts/art/brand-logo.jpg.b64
          wc -c scripts/art/*.b64
      - name: Commit art
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/art/*.b64
          if git diff --cached --quiet; then
            echo "No art changes"
            exit 0
          fi
          git commit -m "Add Ringnest art assets (exact b64 payloads)."
          git push
