name: import-ringnest-art
on:
  push:
    paths:
      - ".github/workflows/import-ringnest-art.yml"
      - "scripts/_import/READY"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-ringnest-art
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download payload and restore files
        run: |
          set -euo pipefail
          URL="https://litter.catbox.moe/sqrer7.gz"
          EXPECT="b1df91a76e40743f4698bdeb700d600a4637423a3b2baada3f4757682bc735de"
          curl -fsSL -o /tmp/rn_payload.tar.gz "$URL"
          ACTUAL=$(sha256sum /tmp/rn_payload.tar.gz | awk '{print $1}')
          echo "expect=$EXPECT actual=$ACTUAL"
          test "$EXPECT" = "$ACTUAL"
          tar -xzf /tmp/rn_payload.tar.gz
          rm -rf scripts/_import
          rm -f .github/workflows/import-ringnest-art.yml
          rm -f .ringnest-push-ping .ringnest-mcp-test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Restore Ringnest code and art assets via Actions import."
          git push
